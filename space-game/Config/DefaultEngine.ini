; Orbitwerk - Engine-Konfiguration
;
; Large World Coordinates (LWC): In UE5 immer aktiv (FVector/FTransform in double).
; Damit sind Positionen weit ab vom Ursprung praezise; zusaetzlich nutzt Orbitwerk
; Origin-Rebasing aufs aktive Vessel (T23). Orbit-Positionen bleiben in oc::Vec3d (OrbitCore).

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/MainMenu.MainMenu
EditorStartupMap=/Game/Maps/MainMenu.MainMenu
GlobalDefaultGameMode=/Script/Orbitwerk.OrbitwerkGameMode
GameInstanceClass=/Script/Engine.GameInstance

[/Script/Engine.Engine]
; Eigene Grafik-Settings-Klasse (Presets Laptop..Kino, Benchmark)
GameUserSettingsClassName=/Script/OrbitwerkRender.OrbitwerkGraphicsSettings

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.RendererSettings]
; --- Global Illumination & Reflexionen: Lumen (Software-Raytracing, laeuft auch auf Laptops) ---
; Lumen an/aus pro Qualitaetsstufe steuert DefaultScalability.ini (r.Lumen.*.Allow),
; deshalb hier nur die Methode festlegen.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Lumen.HardwareRayTracing=False
r.Lumen.TraceMeshSDFs=1

; --- Nanite ---
r.Nanite.ProjectEnabled=True

; --- Anti-Aliasing / Upscaling: TSR (Temporal Super Resolution) ---
r.AntiAliasingMethod=4

; --- Rein dynamische Beleuchtung (Planeten drehen sich, Sonne wandert) ---
r.AllowStaticLighting=False

; --- Himmel / Atmosphaere ---
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True

; --- Sonstiges ---
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.SkinCache.CompileShaders=True
r.CustomDepth=3
r.DefaultBackBufferPixelFormat=4
; Virtual Shadow Maps werden pro Schattenstufe in DefaultScalability.ini geschaltet
; (bewusst NICHT hier, sonst koennte die Scalability-Stufe sie nicht abschalten).

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
