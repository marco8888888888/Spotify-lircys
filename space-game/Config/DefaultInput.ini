; Orbitwerk - Input
; Enhanced Input ist Pflicht (der PlayerController bindet seine Aktionen nur ueber UEnhancedInputComponent).

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; Konsole: ~ (US) und ^ (deutsches Layout)
+ConsoleKeys=Tilde
+ConsoleKeys=Caret
