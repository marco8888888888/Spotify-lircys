; =====================================================================================
; Orbitwerk - Scalability / Grafik-Presets
; =====================================================================================
;
; Zwei Ebenen:
;
; 1) Engine-Gruppen  [<Gruppe>@<Stufe>]   Stufe 0..4 = Low / Medium / High / Epic / Cinematic
;    Werden mit den Engine-Defaults (BaseScalability.ini) zusammengefuehrt; hier stehen nur
;    die Orbitwerk-Abweichungen. Lumen an/aus haengt an GI-/Reflexions-Stufe:
;      Stufe 0   : kein Lumen, kein SSGI (billigste GI)
;      Stufe 1   : kein Lumen, Fallback SSGI + SSR
;      Stufe 2-4 : Lumen GI + Lumen-Reflexionen
;    -> UOrbitwerkGraphicsSettings::SetLumenEnabled() verschiebt nur diese Stufen.
;
; 2) Orbitwerk-Presets  [OrbitwerkPreset.<Name>]
;    Gelesen von UOrbitwerkGraphicsSettings (OrbitwerkRender) nach jedem ApplySettings.
;    Eckdaten (Scalability-Stufe / Aufloesung / FPS-Limit) stehen im C++:
;
;      Preset      Stufe  Aufloesung (TSR)  FPS-Limit  Lumen
;      Laptop        0         58 %            60       aus
;      Niedrig       0         70 %            -        aus
;      Mittel        1         80 %            -        aus (SSGI)
;      Hoch          2         90 %            -        an
;      Episch        3        100 %            -        an
;      Kino          4        100 %            -        an
;
;    REGEL: Jede Preset-Sektion muss DIESELBEN Schluessel setzen, sonst bleiben Werte
;    eines vorherigen Presets haengen. Neue ow.*-CVars (OrbitwerkQuality.h) in ALLE
;    sechs Sektionen eintragen. Noch nicht registrierte CVars werden still uebersprungen.
;
;    r.Nanite.MaxPixelsPerEdge = Nanite-Detail (hoeher = grober, schneller; Engine-Default 1)
; =====================================================================================


; ---------------- Global Illumination ----------------
[GlobalIlluminationQuality@0]
r.Lumen.DiffuseIndirect.Allow=0
r.SSGI.Enable=0
r.DistanceFieldAO=0

[GlobalIlluminationQuality@1]
r.Lumen.DiffuseIndirect.Allow=0
r.SSGI.Enable=1
r.SSGI.Quality=1

[GlobalIlluminationQuality@2]
r.Lumen.DiffuseIndirect.Allow=1
r.SSGI.Enable=0

[GlobalIlluminationQuality@3]
r.Lumen.DiffuseIndirect.Allow=1
r.SSGI.Enable=0

[GlobalIlluminationQuality@4]
r.Lumen.DiffuseIndirect.Allow=1
r.SSGI.Enable=0


; ---------------- Reflexionen ----------------
[ReflectionQuality@0]
r.Lumen.Reflections.Allow=0
r.SSR.Quality=0

[ReflectionQuality@1]
r.Lumen.Reflections.Allow=0
r.SSR.Quality=2

[ReflectionQuality@2]
r.Lumen.Reflections.Allow=1

[ReflectionQuality@3]
r.Lumen.Reflections.Allow=1

[ReflectionQuality@4]
r.Lumen.Reflections.Allow=1


; ---------------- Schatten ----------------
; Virtual Shadow Maps erst ab Hoch; darunter klassische Shadow Maps.
[ShadowQuality@0]
r.Shadow.Virtual.Enable=0

[ShadowQuality@1]
r.Shadow.Virtual.Enable=0

[ShadowQuality@2]
r.Shadow.Virtual.Enable=1

[ShadowQuality@3]
r.Shadow.Virtual.Enable=1

[ShadowQuality@4]
r.Shadow.Virtual.Enable=1


; =====================================================================================
; Orbitwerk-Presets (ow.* siehe Source/OrbitwerkRender/Public/OrbitwerkQuality.h)
; =====================================================================================

[OrbitwerkPreset.Laptop]
r.Nanite.MaxPixelsPerEdge=4
ow.Clouds.Quality=0
ow.Particles.Quality=0
ow.Atmosphere.Quality=0
ow.Planet.Quality=0
ow.Plume.Quality=0
ow.Reentry.Quality=0

[OrbitwerkPreset.Low]
r.Nanite.MaxPixelsPerEdge=2
ow.Clouds.Quality=0
ow.Particles.Quality=1
ow.Atmosphere.Quality=1
ow.Planet.Quality=1
ow.Plume.Quality=1
ow.Reentry.Quality=1

[OrbitwerkPreset.Medium]
r.Nanite.MaxPixelsPerEdge=1.5
ow.Clouds.Quality=1
ow.Particles.Quality=2
ow.Atmosphere.Quality=2
ow.Planet.Quality=2
ow.Plume.Quality=2
ow.Reentry.Quality=2

[OrbitwerkPreset.High]
r.Nanite.MaxPixelsPerEdge=1
ow.Clouds.Quality=2
ow.Particles.Quality=3
ow.Atmosphere.Quality=3
ow.Planet.Quality=3
ow.Plume.Quality=3
ow.Reentry.Quality=3

[OrbitwerkPreset.Epic]
r.Nanite.MaxPixelsPerEdge=1
ow.Clouds.Quality=3
ow.Particles.Quality=4
ow.Atmosphere.Quality=4
ow.Planet.Quality=4
ow.Plume.Quality=4
ow.Reentry.Quality=4

[OrbitwerkPreset.Cinematic]
r.Nanite.MaxPixelsPerEdge=1
ow.Clouds.Quality=4
ow.Particles.Quality=4
ow.Atmosphere.Quality=4
ow.Planet.Quality=4
ow.Plume.Quality=4
ow.Reentry.Quality=4
