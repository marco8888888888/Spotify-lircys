name: Android-App bauen

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - run: cp android/app/build/outputs/apk/release/app-release.apk LyricsTranslator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LyricsTranslator-apk
          path: LyricsTranslator.apk

      # Immer die neueste APK unter Releases → "Lyrics Translator (Android)" bereitstellen.
      - name: Release aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest LyricsTranslator.apk \
            --target "$GITHUB_SHA" \
            --title "Lyrics Translator (Android)" \
            --notes "Neueste Android-App, gebaut aus ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Auf dem Handy LyricsTranslator.apk herunterladen und öffnen."
